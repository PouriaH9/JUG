services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jug
      POSTGRES_USER: jug
      POSTGRES_PASSWORD: jug_local_only
    ports:
      - "127.0.0.1:54329:5432"
    volumes:
      - jug_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jug -d jug"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  jug_pgdata:
